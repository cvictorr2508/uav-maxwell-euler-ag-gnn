project:
  type: book
  output-dir: _book

lang: pt-BR

book:
  title: "UAV | Maxwell–Euler, Álgebra Geométrica e Graph Neural Networks"
  subtitle: "Fundamentos matemáticos, representação em grafos e validação computacional acadêmica"
  repo-url: "https://github.com/cvictorr2508/uav-maxwell-euler-ag-gnn"
  repo-actions: [edit, issue, source]
  page-navigation: true
  search: true
  chapters:
    - index.qmd
    - chapters/01_problem.qmd
    - chapters/02_geometric_algebra.qmd
    - chapters/03_physics.qmd
    - chapters/04_graph_neural_networks.qmd
    - chapters/05_multifidelity.qmd
    - chapters/06_validation_2d.qmd
    - chapters/07_multifidelity_3d.qmd
    - chapters/08_validation_3d.qmd
  downloads: [pdf]

bibliography: references.bib
csl: ieee.csl

format:
  html:
    from: markdown+tex_math_single_backslash
    theme: cosmo
    toc: true
    number-sections: true
    code-fold: true
  pdf:
    from: markdown+tex_math_single_backslash
    documentclass: scrreprt
    toc: true
    number-sections: true
    keep-tex: false

execute:
  freeze: auto

crossref:
  chapters: true
