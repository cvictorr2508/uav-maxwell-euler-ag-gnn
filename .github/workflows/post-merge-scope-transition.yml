name: One-time academic scope transition

# Runs only on pushes to develop, and makes changes only after PR #22 is merged.
on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  archive-retire-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive old refs and retire development branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/post_merge_scope_transition.sh
